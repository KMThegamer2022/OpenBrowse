name: Diagnose WebView2 include

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: NuGet/setup-nuget@v2
      - name: Probe macro state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory wv2 -NonInteractive | Out-Null
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          $wvInc = 'wv2/Microsoft.Web.WebView2.1.0.2903.40/build/native/include'

          @'
          #include <windows.h>
          #ifdef interface
          #  pragma message("PROBE_A: interface IS defined")
          #endif
          #ifdef CINTERFACE
          #  pragma message("PROBE_A: CINTERFACE IS defined")
          #endif
          #ifndef __cplusplus
          #  pragma message("PROBE_A: __cplusplus NOT defined - compiling as C")
          #endif
          typedef interface IProbe1 IProbe1;
          #pragma message("PROBE_A: typedef interface survived")
          int main() { return 0; }
          '@ | Set-Content probe/probe.cpp -Encoding UTF8

          @'
          #include <windows.h>
          #include <WebView2.h>
          #pragma message("PROBE_B: WebView2.h included cleanly")
          int probe_b() { return 0; }
          '@ | Set-Content probe/with_wv2.cpp -Encoding UTF8

          @'
          #include <windows.h>
          #include <WebView2.h>
          #pragma message("PROBE_C: WebView2.h included cleanly with LEAN")
          int probe_c() { return 0; }
          '@ | Set-Content probe/with_lean.cpp -Encoding UTF8

          Write-Host "=== MSVC version ==="
          cmd /c "cl 2>&1" | Select-Object -First 2

          Write-Host "=== A: windows.h only ==="
          cmd /c "cl /nologo /EHsc /std:c++17 probe/probe.cpp /c 2>&1"
          Write-Host "--- A exit=$LASTEXITCODE"

          Write-Host "=== B: windows.h + WebView2.h ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /I $wvInc probe/with_wv2.cpp /c 2>&1"
          Write-Host "--- B exit=$LASTEXITCODE"

          Write-Host "=== C: windows.h + WebView2.h + WIN32_LEAN_AND_MEAN ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /D WIN32_LEAN_AND_MEAN /I $wvInc probe/with_lean.cpp /c 2>&1"
          Write-Host "--- C exit=$LASTEXITCODE"

          Write-Host "=== D: real main.cpp with the project's flags ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /W4 /permissive- /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX /I openbrowse-cpp/src /I $wvInc openbrowse-cpp/src/main.cpp /c 2>&1"
          Write-Host "--- D exit=$LASTEXITCODE"

          exit 0