name: Diagnose WebView2 include

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Probe macro state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $global:LASTEXITCODE = 0

          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory wv2 -NonInteractive | Out-Null
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          $wvInc = 'wv2/Microsoft.Web.WebView2.1.0.2903.40/build/native/include'

          @'
          #include <windows.h>
          #include <cstdio>
          #ifdef interface
          #  pragma message("PROBE_A: interface IS defined")
          #endif
          #ifdef CINTERFACE
          #  pragma message("PROBE_A: CINTERFACE IS defined")
          #endif
          #ifndef __cplusplus
          #  pragma message("PROBE_A: __cplusplus NOT defined - compiling as C")
          #endif
          typedef interface IProbe1 IProbe1;
          int main() {
            printf("cplusplus=%ld\n", (long)__cplusplus);
          #ifdef interface
            printf("interface defined\n");
          #else
            printf("interface NOT defined\n");
          #endif
          #ifdef CINTERFACE
            printf("CINTERFACE defined\n");
          #else
            printf("CINTERFACE not defined\n");
          #endif
            printf("probeA ok\n");
            return 0;
          }
          '@ | Set-Content probe/probe.cpp -Encoding UTF8

          @'
          #include <windows.h>
          #include <WebView2.h>
          int probe_b() { return 0; }
          '@ | Set-Content probe/with_wv2.cpp -Encoding UTF8

          @'
          #include <windows.h>
          #include <wrl.h>
          #include <WebView2.h>
          int probe_d() { return 0; }
          '@ | Set-Content probe/with_wrl.cpp -Encoding UTF8

          Write-Host "=== MSVC version ==="
          cmd /c "cl 2>&1" | Select-Object -First 3

          Write-Host "=== A: windows.h only ==="
          cmd /c "cl /nologo /EHsc /std:c++17 probe/probe.cpp /Fe:probe/probeA.exe 2>&1"
          Write-Host "A exit=$LASTEXITCODE"

          Write-Host "=== B: windows.h + WebView2.h ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /I $wvInc probe/with_wv2.cpp /c 2>&1"
          Write-Host "B exit=$LASTEXITCODE"

          Write-Host "=== C: windows.h + WebView2.h + WIN32_LEAN_AND_MEAN ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /D WIN32_LEAN_AND_MEAN /I $wvInc probe/with_wv2.cpp /c 2>&1"
          Write-Host "C exit=$LASTEXITCODE"

          Write-Host "=== D: windows.h + wrl.h + WebView2.h ==="
          cmd /c "cl /nologo /EHsc /std:c++17 /I $wvInc probe/with_wrl.cpp /c 2>&1"
          Write-Host "D exit=$LASTEXITCODE"

          Write-Host "=== E: commctrl.h first, then windows.h, wrl.h, WebView2.h ==="
          @'
          #include <commctrl.h>
          #include <windows.h>
          #include <wrl.h>
          #include <WebView2.h>
          int probe_e() { return 0; }
          '@ | Set-Content probe/with_commctrl.cpp -Encoding UTF8
          cmd /c "cl /nologo /EHsc /std:c++17 /I $wvInc probe/with_commctrl.cpp /c 2>&1"
          Write-Host "E exit=$LASTEXITCODE"

          exit 0