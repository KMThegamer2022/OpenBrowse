name: Diagnose commctrl

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Locate the tab control declarations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $inc = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          Write-Host "=== which SDK headers mention TCIFIMAGE ==="
          Get-ChildItem -Path $inc -Recurse -Include *.h -ErrorAction SilentlyContinue |
            Select-String -Pattern 'TCIFIMAGE' -SimpleMatch -List |
            ForEach-Object { $_.Path }

          Write-Host ""
          Write-Host "=== which SDK headers mention TabStrip_GetCurSel ==="
          Get-ChildItem -Path $inc -Recurse -Include *.h -ErrorAction SilentlyContinue |
            Select-String -Pattern 'TabStrip_GetCurSel' -SimpleMatch -List |
            ForEach-Object { $_.Path }

          Write-Host ""
          Write-Host "=== which SDK headers mention NMTABCTRL ==="
          Get-ChildItem -Path $inc -Recurse -Include *.h -ErrorAction SilentlyContinue |
            Select-String -Pattern 'NMTABCTRL' -SimpleMatch -List |
            ForEach-Object { $_.Path }

          Write-Host ""
          Write-Host "=== context around the first TCIFIMAGE hit ==="
          $hit = Get-ChildItem -Path $inc -Recurse -Include *.h -ErrorAction SilentlyContinue |
                 Select-String -Pattern 'TCIFIMAGE' -SimpleMatch -List | Select-Object -First 1
          if ($hit) {
            $lines = Get-Content $hit.Path
            $n = $hit.LineNumber
            Write-Host "file: $($hit.Path) line $n"
            for ($i = [Math]::Max(0, $n - 20); $i -le [Math]::Min($lines.Count - 1, $n + 1); $i++) {
              "{0,6}: {1}" -f ($i + 1), $lines[$i]
            }
          } else {
            Write-Host "TCIFIMAGE is not in any SDK header"
          }

          Write-Host ""
          Write-Host "=== does the SDK ship a separate tab control header? ==="
          Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um" -Filter '*tab*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

          exit 0